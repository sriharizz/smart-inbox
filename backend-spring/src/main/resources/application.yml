server:
  port: ${PORT:8081}

spring:
  application:
    name: smart-inbox-backend
  profiles:
    active: demo

  # Embedded H2 Database (Oracle Compatibility Mode) for Demo Profile
  datasource:
    url: jdbc:h2:mem:smartinboxdb;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Application Specific Properties
smartinbox:
  ai-service:
    url: ${PYTHON_AI_SERVICE_URL:http://127.0.0.1:8000}
    timeout-seconds: 180
  ingestion:
    mode: ${INGESTION_MODE:FIXTURE}
    fixture-dir: ${FIXTURE_DIR:../test-data/emails}
    auto-ingest-on-startup: false
    fresh-processing: ${MAILBOX_FRESH_PROCESSING:true}
    imap:
      host: ${MAILBOX_IMAP_HOST:${MAIL_IMAP_HOST:imap.gmail.com}}
      port: ${MAILBOX_IMAP_PORT:${MAIL_IMAP_PORT:993}}
      username: ${MAILBOX_EMAIL:${MAIL_IMAP_USERNAME:safety.intake.test@example.com}}
      password: ${MAILBOX_PASSWORD:${MAIL_IMAP_PASSWORD:secret}}
      ssl: ${MAILBOX_IMAP_SSL:${MAIL_IMAP_SSL:true}}
      folder: ${MAILBOX_FOLDER:${MAIL_IMAP_FOLDER:INBOX}}
      poll-interval-ms: ${MAIL_POLL_INTERVAL_MS:30000}
      initial-delay-ms: ${MAIL_POLL_INITIAL_DELAY_MS:5000}
  async:
    core-pool-size: 1
    max-pool-size: 1
    queue-capacity: 100

---
# Production Profile (Authentic Oracle Database 19c/21c)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${ORACLE_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_DB_USERNAME:smartinbox}
    password: ${ORACLE_DB_PASSWORD:secret}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: validate
