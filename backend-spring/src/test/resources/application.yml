spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

smartinbox:
  ingestion:
    auto-ingest-on-startup: false
    mode: FIXTURE
    imap:
      poll-interval-ms: 999999999
      initial-delay-ms: 999999999
